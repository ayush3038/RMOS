spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

rmos:
  cors:
    allowed-origins: ${RMOS_CORS_ALLOWED_ORIGINS:https://yourproductionfrontenddomain.com}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    org.springframework: WARN
    com.rmos: INFO
