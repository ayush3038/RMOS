spring:
  application:
    name: rmos-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rmos}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

rmos:
  integration:
    data-freshness:
      threshold-minutes: 60
  priority:
    weights:
      safety: 0.30
      train-impact: 0.25
      criticality: 0.20
      urgency: 0.15
      duration: 0.05
      workforce: 0.05
    thresholds:
      critical: 0.80
      high: 0.60
      medium: 0.35
