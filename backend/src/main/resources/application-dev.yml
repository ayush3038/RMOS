spring:
  config:
    activate:
      on-profile: dev

rmos:
  cors:
    allowed-origins: ${RMOS_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # Development: Gemini is the PRIMARY provider. The default chain is Gemini-only
  # so a broken or unconfigured Gemini key surfaces honestly instead of being
  # silently masked by a local Ollama answer.
  # Ollama stays available as an explicit local alternative - opt in with:
  #   $env:RMOS_AI_CHAT_PROVIDER = "gemini,ollama"
  #   ollama pull llama3.2   (served at http://localhost:11434)
  #   $env:RMOS_AI_CHAT_OLLAMA_MODEL = "llama3.2"
  ai:
    chat:
      provider: ${RMOS_AI_CHAT_PROVIDER:gemini}
    gemini:
      # Supply the real key through the shell that starts the backend:
      #   $env:GEMINI_API_KEY = "YOUR_REAL_KEY"
      # A missing or placeholder key leaves the provider "not configured".
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.1-flash-lite}

management:
  endpoints:
    web:
      exposure:
        include: "*"
